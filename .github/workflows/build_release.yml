name: Build and Release

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.environment.arch }}, ${{ matrix.ui.name }}, ${{ matrix.build.name }}
    runs-on: ${{ matrix.environment.runner }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {name: Debug, preset: dev_debug, slug: -Debug}
          - {name: Dev, preset: development, slug: -Dev}
        ui:
          - {name: SDL, qt: 'OFF', slug: -SDL}
          - {name: Qt, qt: 'ON', slug: -Qt}
        environment:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ninja-build pkg-config libfreetype-dev libsdl2-dev
          libpng-dev librtmidi-dev libopenal-dev libslirp-dev libfluidsynth-dev
          libvdeplug-dev libserialport-dev libvncserver-dev libzstd-dev libgtest-dev
          qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools
          qt6-l10n-tools libevdev-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D QT=${{ matrix.ui.qt }} -D USE_QT6=ON -D SDL2=ON -D VNC=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Build fork regression tests
        if: matrix.environment.arch == 'x86_64' && matrix.ui.qt == 'OFF' && matrix.build.name == 'Debug'
        run: |
          cmake -S . -B build-checks -G Ninja -D QT=OFF -D SDL2=ON -D BUILD_TESTING=ON
          cmake --build build-checks --parallel 4 --target hdd_image_tests fdd_sfx_tests pc_block_tests codegen_reuse_tests ini_tests random_tests row_boundary_test
          ctest --test-dir build-checks -R '^(FloppySfx\.|HddImage\.|PcBlock\.|CodegenReuse\.|Ini|Random|row_boundary)' --output-on-failure
      - name: Generate package
        run: cmake --install build
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box${{ matrix.ui.slug }}${{ matrix.build.slug }}-Linux-${{ matrix.environment.arch }}
          path: build/artifacts/**
          if-no-files-found: error

  macos:
    name: macOS arm64, SDL and Qt, Debug and Dev
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: >-
          brew install sdl3 rtmidi openal-soft fluidsynth libslirp vde libserialport
          libvncserver vulkan-headers zstd qtbase qttools qtimageformats
      - name: Fetch smoke-test ROMs
        run: git clone --depth 1 https://github.com/86Box/roms.git build/smoke-roms
      - name: Build, package, and test all four configurations
        run: |
          set -euo pipefail
          for ui in SDL Qt; do
            qt=OFF
            if [ "$ui" = Qt ]; then
              qt=ON
            fi
            for variant in Debug Dev; do
              preset=development
              if [ "$variant" = Debug ]; then preset=dev_debug; fi
              build_dir="build/macos-$ui-$variant"
              prefix="$PWD/build/artifacts/$ui-$variant"
              cmake -S . -B "$build_dir" --preset "$preset" \
                -D QT="$qt" -D USE_QT6=ON -D VNC=ON \
                -D CMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
                -D OpenAL_ROOT="$(brew --prefix openal-soft)" \
                -D LIBSERIALPORT_ROOT="$(brew --prefix libserialport)"
              cmake --build "$build_dir" --parallel 3
              cmake --install "$build_dir" --prefix "$prefix"
              app="$prefix/86Box.app"
              find "$app/Contents/MacOS" -type f -exec chmod 755 {} \;
              codesign --force --deep -s - "$app"
              codesign --verify --deep --strict "$app"
              smoke_args=(--binary "$app/Contents/MacOS/86Box" --roms "$PWD/build/smoke-roms")
              if [ "$ui" = Qt ]; then smoke_args+=(--qt); fi
              python3 tests/fork/headless_smoke.py "${smoke_args[@]}"
              python3 tests/fork/headless_smoke.py "${smoke_args[@]}" --no-client
              if [ "$ui-$variant" = Qt-Dev ]; then
                python3 tests/fork/run_settings_roundtrip.py --build "$build_dir" --roms "$PWD/build/smoke-roms"
              fi
              ditto -c -k --sequesterRsrc --keepParent "$app" \
                "build/artifacts/86Box-$ui-$variant-macOS-arm64.zip"
            done
          done
      - name: Upload SDL Debug artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box-SDL-Debug-macOS-arm64
          path: build/artifacts/86Box-SDL-Debug-macOS-arm64.zip
          if-no-files-found: error
      - name: Upload SDL Dev artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box-SDL-Dev-macOS-arm64
          path: build/artifacts/86Box-SDL-Dev-macOS-arm64.zip
          if-no-files-found: error
      - name: Upload Qt Debug artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box-Qt-Debug-macOS-arm64
          path: build/artifacts/86Box-Qt-Debug-macOS-arm64.zip
          if-no-files-found: error
      - name: Upload Qt Dev artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box-Qt-Dev-macOS-arm64
          path: build/artifacts/86Box-Qt-Dev-macOS-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.environment.msystem }}, Qt, ${{ matrix.build.name }}
    runs-on: ${{ matrix.environment.runner }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {name: Debug, preset: dev_debug, slug: -Debug}
          - {name: Dev, preset: development, slug: -Dev}
        environment:
          - {msystem: UCRT64, runner: windows-2022, arch: x86_64}
          - {msystem: CLANGARM64, runner: windows-11-arm, arch: arm64}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare MSYS2 environment
        uses: ./.github/actions/setup-msys2
        with:
          msystem: ${{ matrix.environment.msystem }}
      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D QT=ON -D USE_QT6=OFF -D VNC=OFF
      - name: Build
        run: cmake --build build --parallel 4
      - name: Generate package
        run: cmake --install build
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 86Box-Qt${{ matrix.build.slug }}-Windows-${{ matrix.environment.arch }}
          path: build/artifacts/**
          if-no-files-found: error

  release:
    name: Publish release artifacts
    needs:
      - linux
      - macos
      - windows
    if: ${{ success() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide release tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="autobuild-$(git rev-parse --short "$GITHUB_SHA")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "No artifacts were produced by successful builds."
            exit 0
          fi
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --dir dist

      - name: Package release assets
        run: |
          set -euo pipefail
          if [ ! -d dist ] || [ -z "$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo "No artifact directories to package."
            exit 0
          fi
          mkdir -p release-assets
          for dir in dist/*/; do
            name="$(basename "$dir")"
            zip_count=$(find "$dir" -mindepth 1 -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d ' ')
            entry_count=$(find "$dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
            if [ "$zip_count" -eq 1 ] && [ "$entry_count" -eq 1 ]; then
              cp "$dir"/*.zip "release-assets/${name}.zip"
            else
              (cd "$dir" && zip -r "../../release-assets/${name}.zip" .)
            fi
          done
          ls -lah release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d release-assets ] || [ -z "$(find release-assets -type f -name "*.zip" -print -quit)" ]; then
            echo "No release assets to upload."
            exit 0
          fi
          tag="${{ steps.vars.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --title "86Box nightly - $tag" --notes "Automated build artifacts for $GITHUB_SHA."
          gh release upload "$tag" release-assets/*.zip --clobber
